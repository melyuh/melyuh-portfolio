site_name: Sandbox　─ とりあえずやってみるブログ ─
site_author: Melyuh
# site_url: https://your-cloudfront-domain.cloudfront.net  # TODO: 実際のURLに変更
copyright: "Melyuh. All rights reserved." #「Copyright (C) YYYY」が冒頭に付与される

use_directory_urls: false

theme:
  font:
    text: Noto Sans JP   # 本文・見出し（Google Fonts）
    code: JetBrains Mono # コードブロック（Google Fonts）
  name: material
  language: ja
  # logo は overrides/partials/logo.html で動的に切り替え
  favicon: _assets/melyuh_favicon.png
  custom_dir: overrides
  features:
    # Navigation
    - navigation.instant          # インスタントローディング
    - navigation.instant.prefetch # プリフェッチ機能
    - navigation.tabs             # タブナビゲーション
    - navigation.tabs.sticky      # スティッキータブ
    - navigation.sections         # セクション表示
    - navigation.expand           # 自動展開
    - navigation.indexes          # セクションインデックスページ
    - navigation.top              # トップに戻るボタン
    # Search
    - search.highlight            # 検索ハイライト
    - search.suggest              # 検索サジェスト
    # Content
    - content.code.copy           # コードコピーボタン
    - content.code.select         # コード選択機能
    - content.grids               # グリッドカード
    - content.tooltips            # ツールチップ
  palette:
    - scheme: slate
      primary: "#26C6DA"
      accent: "#00838F"
      toggle:
        icon: material/brightness-4
        name: ライトモードに切替
    - scheme: default
      primary: "#00838F"
      accent: "#26C6DA"
      toggle:
        icon: material/brightness-7
        name: ダークモードに切替

extra_css:
  - _stylesheets/extra.css
  - _stylesheets/pdf.css
  - _stylesheets/glightbox.min.css

extra_javascript:
  - _javascripts/mermaid.min.js
  - _javascripts/glightbox.min.js
  - _javascripts/pdf_scheme.js

markdown_extensions:
  # --- 基本 ---
  - tables
  - footnotes
  - abbr
  - def_list
  - attr_list
  - md_in_html

  # --- 目次 ---
  - toc:
      permalink: true
      toc_depth: 3

  # --- 注意書き・折りたたみ ---
  - admonition
  - pymdownx.details

  # --- コードブロック ---
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets

  # --- テキスト装飾 ---
  - pymdownx.mark
  - pymdownx.caret
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.critic
  - pymdownx.smartsymbols:
      fractions: false

  # --- タブ・チェックリスト ---
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

  # --- リンク・アイコン ---
  - pymdownx.magiclink
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

hooks:
  - hooks/build_config.py

watch:
  - docs
  - hooks
  - overrides
  - mkdocs.yml

plugins:
  # --- 常に有効（軽量） ---
  - search:
      lang: ja
  - awesome-pages
  - blog:
      blog_dir: blog
      post_url_date_format: yyyy/MM
      post_date_format: long
      archive_date_format: yyyy年
      categories: true
      authors: false
  - tags
  - table-reader:
      enabled: true
  - glightbox

  # --- build 時のみ有効（ソーシャルカード生成） ---
  - social:
      enabled: !ENV [ENABLE_SOCIAL, false]
      cards_layout_options:
        background_color: "#00838F"   # ライトモードのprimary色
        color: "#ffffff"
        font_family: Noto Sans JP      # Google Fonts 上の名称

  # --- serve 時は無効化（重い） ---
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      locale: ja
      enabled: !ENV [ENABLE_GIT_INFO, false]
  - git-authors:
      show_contribution: true
      show_line_count: false
      count_empty_lines: false
      enabled: !ENV [ENABLE_GIT_INFO, false]

  # --- build 時のみ（環境変数で制御） ---
  - mermaid-to-svg:
      enabled: !ENV [RENDER_SVG, false]
      output_dir: _images
      image_id_enabled: true
      image_id_prefix: mermaid-diagram
      mermaid_config:
        flowchart:
          htmlLabels: false
        class:
          htmlLabels: false
  - svg-to-png:
      enabled: !ENV [RENDER_PNG, false]
      output_dir: _images
  - to-pdf:
      enabled: !ENV [ENABLE_PDF, false]
      toc_title: 目次
      toc_level: 2
      # cover_logo は hooks/build_config.py が PDF_SCHEME に応じて動的に設定
  - minify:
      enabled: !ENV [ENABLE_MINIFY, false]
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
        remove_empty_space: true
